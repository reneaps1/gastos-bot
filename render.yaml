services:
  - type: web
    name: gastos-bot
    runtime: node
    plan: free
    buildCommand: npm install && DATABASE_URL="postgresql://x:x@localhost:0/x" npx prisma generate
    startCommand: npx prisma generate && node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gastos-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_ENABLED
        value: "false"
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TODOIST_API_TOKEN
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: gastos-dashboard
    runtime: node
    plan: free
    buildCommand: cd dashboard && npm install && npm run build
    startCommand: cd dashboard && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gastos-db
          property: connectionString
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: gastos-db
    plan: free
    databaseName: gastos
    user: gastos_user
